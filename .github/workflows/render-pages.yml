name: Render VEILO test pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-pages.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils webp
          python -m pip install --upgrade gdown

      - name: Download VEILO_TEST.pdf
        run: |
          python -m gdown 'https://drive.google.com/uc?id=1o4T3_VxeAe77I_uxY06uk8byRm1ukaYw' -O VEILO_TEST.pdf
          test -s VEILO_TEST.pdf
          file VEILO_TEST.pdf
          pdfinfo VEILO_TEST.pdf | head -20

      - name: Render document pages
        run: |
          rm -rf pages _rendered
          mkdir -p pages _rendered
          pdftoppm -jpeg -r 120 -jpegopt quality=92,optimize=y VEILO_TEST.pdf _rendered/page
          i=1
          while IFS= read -r f; do
            printf -v n '%02d' "$i"
            cwebp -quiet -q 72 -m 6 "$f" -o "pages/page-$n.webp"
            i=$((i+1))
          done < <(find _rendered -maxdepth 1 -name 'page-*.jpg' | sort -V)
          count="$(find pages -name '*.webp' | wc -l)"
          echo "Rendered pages: $count"
          test "$count" -eq 26
          ls -lh pages | head

      - name: Commit rendered pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages
          if git diff --cached --quiet; then
            echo 'No page changes to commit.'
            exit 0
          fi
          git commit -m 'Add rendered VEILO_TEST pages'
          git push
