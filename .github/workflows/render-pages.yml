name: Render VEILO test pages

on:
  push:
    paths:
      - '.github/workflows/render-pages.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils webp

      - name: Download VEILO_TEST.pdf
        run: |
          curl -L --fail --retry 3 \
            -o VEILO_TEST.pdf \
            'https://drive.usercontent.google.com/download?id=1o4T3_VxeAe77I_uxY06uk8byRm1ukaYw&export=download&confirm=t'
          pdfinfo VEILO_TEST.pdf | head -20

      - name: Render document pages
        run: |
          rm -rf pages _rendered
          mkdir -p pages _rendered
          pdftoppm -jpeg -r 120 -jpegopt quality=92,optimize=y VEILO_TEST.pdf _rendered/page
          i=1
          for f in $(find _rendered -maxdepth 1 -name 'page-*.jpg' | sort -V); do
            printf -v n '%02d' "$i"
            cwebp -quiet -q 72 -m 6 "$f" -o "pages/page-$n.webp"
            i=$((i+1))
          done
          test "$(find pages -name '*.webp' | wc -l)" -eq 26
          ls -lh pages | head

      - name: Commit rendered pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages
          git commit -m 'Add rendered VEILO_TEST pages' || exit 0
          git push
